name: Testing

on:
  push:
    branches:
    - main
    - release/*
    - feature/**
  pull_request:
    branches:
    - main
    - release/*
    - feature/**

permissions:
  contents: write

# Always force the use of Go modules
env:
  GO111MODULE: on
  GOSUMDB: off
  GOPROXY: https://goproxy.cn,direct

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      # Setup the environment.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      # Checkout latest code
      - name: Checkout repo
        uses: actions/checkout@v4

      # Download dependencies
      - name: Download dependencies
        run: |
          go mod download

      # Run unit tests (no external Polaris server required)
      - name: Run unit tests
        run: |
          go test -count=1 -timeout=10m -coverprofile=coverage_unit.txt \
            -coverpkg=./api/...,./pkg/...,./plugin/... \
            ./api/... ./pkg/... ./plugin/...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage_unit.txt
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
