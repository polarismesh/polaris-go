name: Testing

on:
  push:
    branches:
    - main
    - release/*
    - feature/**
  pull_request:
    branches:
    - main
    - release/*
    - feature/**

permissions:
  contents: write

# Always force the use of Go modules
env:
  GO111MODULE: on
  GOSUMDB: off
  GOPROXY: https://goproxy.cn,direct

jobs:
  build:
    runs-on: ubuntu-latest
    # strategy set
    strategy:
      matrix:
        go: ["1.19", "1.20", "1.21", "1.22", "1.23", "1.24"]
    steps:
      # Setup the environment.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      # Checkout latest code
      - name: Checkout repo
        uses: actions/checkout@v4

      # Download dependencies
      - name: Download dependencies
        run: |
          go mod download

      # Build to verify compilation
      - name: Build
        run: go build -v ./...

      # Run tests
      - name: run tests
        continue-on-error: true
        run: |
          set -ex         # Exit on error; debugging enabled.
          set -o pipefail # Fail a pipe if any sub-command fails.
          
          cd ./test
          for line in $(cat suit.txt)
          do
            if [[ "${line}" == "" ]]; then
              continue
            fi
            export SDK_SUIT_TEST=${line}
            echo "SDK_SUIT_TEST=${SDK_SUIT_TEST}"
            go test -timeout=120m -v -covermode=count -coverprofile=coverage_${line}.txt -coverpkg=github.com/polarismesh/polaris-go/api,github.com/polarismesh/polaris-go/pkg,github.com/polarismesh/polaris-go/plugin
          done

      - name: Upload coverage reports to Codecov
        if: matrix.go == '1.21'
        uses: codecov/codecov-action@v4
        with:
          files: ./test/coverage_*.txt
          flags: integration
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
