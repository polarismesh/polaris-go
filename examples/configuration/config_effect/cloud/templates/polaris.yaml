global:
  serverConnector:
    addresses:
      - ${POLARIS_SERVER}:8091
    token: ${POLARIS_TOKEN}
    connectTimeout: 5000ms
  api:
    timeout: 5s
    maxRetryTimes: 2
    retryInterval: 1s
  eventReporter:
    enable: true
    chain:
      - pushgateway
config:
  configConnector:
    addresses:
      - ${POLARIS_SERVER}:8093
    token: ${POLARIS_TOKEN}
  # 加密配置解密：crypto 过滤器需显式挂链（默认空链），否则加密文件的生效内容是密文
  configFilter:
    chain:
      - crypto
